name: Deploy to GitHub Pages

# Every push to main publishes the contents of site/ to cmfsurgeon.com.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # Apple Wallet business card: built and signed only when the certificate secrets exist.
      - name: Build Apple Wallet pass
        env:
          PASS_CERT_P12_BASE64: ${{ secrets.PASS_CERT_P12_BASE64 }}
          PASS_CERT_PASSWORD: ${{ secrets.PASS_CERT_PASSWORD }}
          PASS_TYPE_ID: ${{ vars.PASS_TYPE_ID }}
          TEAM_ID: ${{ vars.TEAM_ID }}
        run: |
          if [ -n "$PASS_CERT_P12_BASE64" ] && [ -n "$PASS_TYPE_ID" ] && [ -n "$TEAM_ID" ]; then
            wallet/build-pass.sh "$PWD/site/onur-dogru.pkpass"
            sed -i 's#<!-- wallet-button -->#<a class="btn btn-outline-light btn-wallet" href="onur-dogru.pkpass">Add to Apple Wallet</a>#g' site/index.html
          else
            echo "Wallet certificate not configured - skipping the pass."
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
